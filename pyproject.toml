[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adlab"
version = "0.1.0"
description = "Computational Advertising Laboratory: a local teaching platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "plotly>=5.20",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/adlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
